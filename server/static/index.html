<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odele</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #141a24;
      --card: #171d29;
      --fg: #d6dae3;
      --muted: #7f8a9b;
      --accent: #243043;
      --danger: #5a2b2b;
      --green: #79d98a;
      --red: #ff6b6b;
      --yellow: #ffd166;
      --orange: #c98a3d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .layout { display: flex; min-height: 100vh; }
    aside { width: 220px; background: var(--panel); padding: 24px 16px; flex-shrink: 0; }
    aside .brand { font-size: 20px; font-weight: 700; }
    aside .ver { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
    aside nav a { display: block; color: var(--fg); text-decoration: none;
                  padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; }
    aside nav a.active, aside nav a:hover { background: var(--accent); }
    main { flex: 1; padding: 20px 24px; overflow: auto; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    button { background: var(--accent); color: var(--fg); border: 0; border-radius: 6px;
             padding: 9px 14px; cursor: pointer; font-size: 13px; }
    button.danger { background: var(--danger); }
    button:hover { filter: brightness(1.15); }
    button.small { padding: 4px 10px; font-size: 12px; }
    input, select { background: var(--card); color: var(--fg); border: 1px solid var(--accent);
                    border-radius: 6px; padding: 8px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1f2735; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:hover td { background: var(--card); }
    .actions { display: flex; gap: 6px; white-space: nowrap; }
    .st-running { color: var(--yellow); }
    .st-preparing { color: var(--muted); }
    .st-solved { color: var(--green); }
    .st-done, .st-failed, .st-error { color: var(--red); }
    .st-cancelled { color: var(--orange); }
    .flag { color: var(--green); font-family: Menlo, monospace; }
    .muted { color: var(--muted); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6);
                      display: none; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--panel); border-radius: 12px; padding: 22px 26px;
             width: min(640px, 92vw); max-height: 86vh; overflow: auto; }
    .modal h2 { margin-top: 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; color: var(--muted); margin-bottom: 6px; font-size: 12px; }
    .checks { display: flex; gap: 14px; }
    .checks label { display: inline-flex; align-items: center; gap: 4px; color: var(--fg); }
    pre { background: var(--card); padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Odele</div>
    <div class="ver">v0.4.0 · web</div>
    <nav>
      <a href="#" class="active" id="navCtf" onclick="showView('ctf');return false">CTF 打题</a>
      <a href="#" id="navMem" onclick="showView('mem');return false">通话池</a>
      <a href="#" id="navManual" onclick="showView('manual');return false">手动解题</a>
      <a href="#" id="navConfig" onclick="showView('config');return false">配置管理</a>
    </nav>
  </aside>
  <main>
    <section id="ctfView">
      <div class="toolbar">
        <button id="btnAuto">▶ 开始打题</button>
        <button id="btnBatchDelete" class="danger">批量删除失败</button>
        <span id="status" class="muted"></span>
      </div>
      <table>
        <thead>
          <tr><th style="width:56px">编号</th><th style="width:80px">大类</th><th>题目名称</th>
              <th style="width:80px">状态</th><th style="width:110px">创建时间</th><th style="width:220px">操作</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <section id="memView" style="display:none">
      <div class="toolbar">
        <input id="memSearch" placeholder="搜索记忆池…" style="flex:1">
        <button id="memSearchBtn">搜索</button>
        <span id="memCount" class="muted"></span>
      </div>
      <div id="memList"></div>
    </section>
    <section id="manualView" style="display:none">
      <div style="background:var(--panel);border-radius:10px;padding:20px 24px;max-width:640px">
        <h2>手动解题</h2>
        <div class="field">
          <label>方向</label>
          <select id="manDir"><option value="web">web</option><option value="crypto">crypto</option><option value="forensics">forensics</option></select>
        </div>
        <div class="field">
          <label>目标 URL（web 必填，每行一个）</label>
          <input id="manUrls" placeholder="https://target/…">
        </div>
        <div class="field">
          <label>题目描述 / 提示</label>
          <input id="manDesc" placeholder="description">
        </div>
        <div class="field">
          <label>max turns</label>
          <input id="manTurns" type="number" value="100">
        </div>
        <div class="field">
          <label>flag prefix</label>
          <input id="manPrefix" value="flag">
        </div>
        <button id="manStart">开始 ▶</button>
      </div>
    </section>
    <section id="configView" style="display:none">
      <div style="background:var(--panel);border-radius:10px;padding:20px 24px;max-width:640px">
        <h2>配置管理</h2>
        <pre id="configBody"></pre>
        <button id="clearFailed" class="danger">清空失败黑名单</button>
        <p class="muted">配置通过 .env 修改，重启服务生效。</p>
      </div>
    </section>
  </main>
</div>

<!-- autosolve modal -->
<div class="modal-backdrop" id="autoModal">
  <div class="modal">
    <h2>开始打题</h2>
    <div class="field">
      <label>方向（多选）</label>
      <div class="checks" id="dirChecks"></div>
    </div>
    <div class="field">
      <label>难度</label>
      <select id="diffSel">
        <option value="">不限</option><option>简单</option><option>中等</option><option>困难</option>
      </select>
    </div>
    <div class="field">
      <label>每个 token 最多解几道（0 = 不限）</label>
      <input id="maxInput" type="number" value="3" min="0">
    </div>
    <p id="autoInfo" class="muted"></p>
    <button id="autoStart">开始 ▶</button>
    <button id="autoCancel" style="background:#2a3648">取消</button>
  </div>
</div>

<!-- detail modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <p><span id="detailStatus" class="muted"></span></p>
    <p>FLAG <span class="flag" id="detailFlag">—</span></p>
    <div id="detailTabs" style="margin-bottom:10px"></div>
    <pre id="detailBody"></pre>
    <button id="detailClose" style="background:#2a3648">关闭</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
